http:
  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          - "vinod:$apr1$KU0F57cy$d4SjDO19nS1.i.FT7BqH31"

  routers:
    jellyfin:
      rule: "Host(`jellyfin.home.kurup.net`)"
      entryPoints: [websecure]
      service: jellyfin
      tls:
        certResolver: cloudflare
        domains:
          - main: "home.kurup.net"
            sans:
              - "*.home.kurup.net"

    sonarr:
      rule: "Host(`sonarr.home.kurup.net`)"
      entryPoints: [websecure]
      service: sonarr
      tls:
        certResolver: cloudflare

    radarr:
      rule: "Host(`radarr.home.kurup.net`)"
      entryPoints: [websecure]
      service: radarr
      tls:
        certResolver: cloudflare

    prowlarr:
      rule: "Host(`prowlarr.home.kurup.net`)"
      entryPoints: [websecure]
      service: prowlarr
      tls:
        certResolver: cloudflare

    bazarr:
      rule: "Host(`bazarr.home.kurup.net`)"
      entryPoints: [websecure]
      service: bazarr
      tls:
        certResolver: cloudflare

    deluge:
      rule: "Host(`deluge.home.kurup.net`)"
      entryPoints: [websecure]
      service: deluge
      tls:
        certResolver: cloudflare

    sabnzbd:
      rule: "Host(`sabnzbd.home.kurup.net`)"
      entryPoints: [websecure]
      service: sabnzbd
      tls:
        certResolver: cloudflare

    calibre-web:
      rule: "Host(`books.home.kurup.net`)"
      entryPoints: [websecure]
      service: calibre-web
      tls:
        certResolver: cloudflare

    homepage:
      rule: "Host(`home.kurup.net`)"
      entryPoints: [websecure]
      service: homepage
      tls:
        certResolver: cloudflare

    grampsweb:
      rule: "Host(`grampsweb.home.kurup.net`)"
      entryPoints: [websecure]
      service: grampsweb
      tls:
        certResolver: cloudflare

    uptime-kuma:
      rule: "Host(`uptime.home.kurup.net`)"
      entryPoints: [websecure]
      service: uptime-kuma
      tls:
        certResolver: cloudflare

    scrutiny:
      rule: "Host(`scrutiny.home.kurup.net`)"
      entryPoints: [websecure]
      service: scrutiny
      tls:
        certResolver: cloudflare

    netdata:
      rule: "Host(`netdata.home.kurup.net`)"
      entryPoints: [websecure]
      service: netdata
      # netdata's agent dashboard has no authentication of its own, and it exposes the
      # host in detail: process list, network connections, systemd units, disk layout,
      # per-container metrics. Reusing the dashboard-auth credential rather than leaving
      # it open to anything already on the LAN or tailnet.
      middlewares: [dashboard-auth]
      tls:
        certResolver: cloudflare

    traefik:
      rule: "Host(`traefik.home.kurup.net`)"
      entryPoints: [websecure]
      service: api@internal
      middlewares: [dashboard-auth]
      tls:
        certResolver: cloudflare

    # Home Assistant runs on a separate Raspberry Pi (HAOS), not this host.
    homeassistant:
      rule: "Host(`ha.home.kurup.net`)"
      entryPoints: [websecure]
      service: homeassistant
      tls:
        certResolver: cloudflare

    # life103 — family location app. Routed by container name over the internal life103
    # network (Traefik joins it in compose.yml); no host port is published.
    life103:
      rule: "Host(`life103.home.kurup.net`)"
      entryPoints: [websecure]
      service: life103
      tls:
        certResolver: cloudflare

    ntfy:
      rule: "Host(`ntfy.home.kurup.net`)"
      entryPoints: [websecure]
      service: ntfy
      tls:
        certResolver: cloudflare

    # Signed APKs for Obtainium (8.2). Same internal network, same TLS, no host port.
    life103-apk:
      rule: "Host(`apk.home.kurup.net`)"
      entryPoints: [websecure]
      service: life103-apk
      tls:
        certResolver: cloudflare

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:8096"

    sonarr:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:8989"

    radarr:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:7878"

    prowlarr:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:9696"

    bazarr:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:6767"

    deluge:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:8112"

    sabnzbd:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:8080"

    calibre-web:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:8083"

    homepage:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:3000"

    grampsweb:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:5000"

    uptime-kuma:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:3001"

    scrutiny:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:8085"

    netdata:
      loadBalancer:
        servers:
          - url: "http://192.168.1.20:19999"

    homeassistant:
      loadBalancer:
        servers:
          - url: "http://192.168.1.248:8123"

    # By container name, not host IP: these live on the internal life103 network with no
    # published ports, reachable only because Traefik joined that network.
    life103:
      loadBalancer:
        servers:
          - url: "http://life103-api:3000"

    ntfy:
      loadBalancer:
        servers:
          - url: "http://ntfy:8080"

    life103-apk:
      loadBalancer:
        servers:
          - url: "http://life103-apk:80"
