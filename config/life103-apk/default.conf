# Serves the life103 APKs for Obtainium (8.2).
#
# autoindex is the whole point: Obtainium's self-hosted source scrapes an HTML page for
# links ending in .apk and reads the version out of the filename, so nginx's generated
# listing is exactly the format it wants and there is no index to keep in step.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        autoindex on;
        # Off, both of them: Obtainium parses the anchor text, and the size and date
        # columns are noise to it. Plain links are the least there is to misread.
        autoindex_exact_size off;
        autoindex_localtime on;

        # Android refuses to install a download served as text/plain, and nginx does not
        # know this extension by default.
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }

    # Nothing here is secret -- the APK is the same one on five phones -- but it is also
    # nobody's business outside the tailnet, and the only route in is Traefik.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
