services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
      - VPN_SERVICE_PROVIDER=purevpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Netherlands # gluetun VPN exit location
      - UPDATER_PERIOD=${UPDATER_PERIOD}
    ports:
      - 8112:8112 # port for deluge web UI to be reachable from local network
      - 8080:8080 # sabnzbd
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun

  deluge:
    container_name: deluge
    image: lscr.io/linuxserver/deluge:latest
    restart: unless-stopped
    network_mode: service:gluetun # run on the gluetun network
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - ${MEDIA_ROOT}/torrents:/data/torrents
      - ${CONFIG_ROOT}/deluge:/config # config files

  prowlarr:
    container_name: prowlarr
    image: linuxserver/prowlarr:nightly
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - UMASK=002
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_ROOT}/prowlarr:/config # config files
      - ${MEDIA_ROOT}/torrents/downloads/torrent-blackhole:/downloads # FIXME place where to put .torrent files for manual download / I added as jackett had it. testing if necessary

#  organizr:
#    image: organizr/organizr
#    container_name: organizr
#    environment:
#      - PUID=${PUID} # default user id, defined in .env
#      - PGID=${PGID} # default group id, defined in .env
#      - TZ=${TZ} # timezone, defined in .env
#      - fpm=true #true or false | using true will provide better performance
#      - branch=v2-master #v2-master or #v2-develop
#    volumes:
#      - ${CONFIG_ROOT}/organizr:/config
#    ports:
#      - 8001:80
#    restart: unless-stopped

  sabnzbd:
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: unless-stopped
#    network_mode: host
    network_mode: service:gluetun # run on the gluetun network
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - ${MEDIA_ROOT}/usenet:/data/usenet # download folder
      - ${CONFIG_ROOT}/sabnzbd:/config # config files
#    ports:
#     - 8080:8080 

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_ROOT}/sonarr:/config # config files
      - ${MEDIA_ROOT}:/data

  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_ROOT}/radarr:/config # config files
      - ${MEDIA_ROOT}:/data

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
      - JELLYFIN_PublishedServerUrl=http://192.168.1.20 #optional
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}/media:/data/media
#    ports:
#      - 8096:8096
#      - 8920:8920 #optional
#      - 7359:7359/udp #optional
#      - 1900:1900/udp #optional
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
      - UMASK_SET=022 #optional
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config # config files
      - ${MEDIA_ROOT}:/data

  traefik:
    container_name: traefik
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro  # version-controlled, no secrets
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro           # version-controlled, no secrets
      - ${CONFIG_ROOT}/traefik/acme.json:/acme.json                # TLS certs — not in repo
    networks:
      - default   # unchanged: reaches host-networked services via 192.168.1.20
      - life103   # added: reach life103-api and ntfy by container name

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.kurup.net
    env_file:
      - .env  # provides HOMEPAGE_VAR_* for API keys
    volumes:
      - ./config/homepage:/app/config  # version-controlled; API keys injected via HOMEPAGE_VAR_*

  calibre-web:
    container_name: calibre-web
    image: lscr.io/linuxserver/calibre-web:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:universal-calibre # enables ebook conversion
    volumes:
      - ${CONFIG_ROOT}/calibre-web:/config
      - ${MEDIA_ROOT}/media/books:/books

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${CONFIG_ROOT}/uptime-kuma:/app/data

  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    restart: unless-stopped
    privileged: true
    ports:
      - "8085:8080"
    cap_add:
      - SYS_RAWIO
    volumes:
      - /run/udev:/run/udev:ro
      - ${CONFIG_ROOT}/scrutiny:/opt/scrutiny/config
      - scrutiny-influxdb:/opt/scrutiny/influxdb
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
      - /dev/sde:/dev/sde
      - /dev/sdf:/dev/sdf

  # https://www.grampsweb.org/install_setup/deployment/
  grampsweb: &grampsweb
    container_name: grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    #user: "1000:1000"
    restart: unless-stopped
    environment:
      GRAMPSWEB_TREE: "Gramps Web"  # will create a new tree if not exists
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      - grampsweb_redis
    volumes:
      - ${CONFIG_ROOT}/gramps/users:/app/users  # persist user database
      - ${CONFIG_ROOT}/gramps/index:/app/indexdir  # persist search index
      - ${CONFIG_ROOT}/gramps/thumb_cache:/app/thumbnail_cache  # persist thumbnails
      - ${CONFIG_ROOT}/gramps/cache:/app/cache  # persist export and report caches
      - ${CONFIG_ROOT}/gramps/secret:/app/secret  # persist flask secret
      - ${CONFIG_ROOT}/gramps/db:/root/.gramps/grampsdb  # persist Gramps database
      - ${MEDIA_ROOT}/gramps/media:/app/media  # persist media files
      - ${CONFIG_ROOT}/gramps/tmp:/tmp
    ports:
      - 5000:5000

  grampsweb_celery:
    <<: *grampsweb  # YAML merge key copying the entire grampsweb service config
    ports: []
    container_name: grampsweb_celery
    depends_on:
      - grampsweb
      - grampsweb_redis
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    image: docker.io/library/redis:7.2.4-alpine
    container_name: grampsweb_redis
    restart: always

  # life103 — family location app. Custom API image built + published from the life103
  # repo (ghcr.io/vkurup/life103-backend); Postgres and ntfy are stock images. All three
  # sit on an internal `life103` network with no host ports: the only way in is through
  # Traefik's TLS (see config/traefik/dynamic/services.yml), and Postgres is unreachable
  # from outside the network entirely.
  life103-db:
    container_name: life103-db
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: life103
      POSTGRES_USER: life103
      POSTGRES_PASSWORD: ${LIFE103_DB_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/life103-db:/var/lib/postgresql/data  # in the backup sweep
    networks:
      - life103
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life103 -d life103"]
      interval: 10s
      timeout: 5s
      retries: 10

  life103-api:
    container_name: life103-api
    image: ghcr.io/vkurup/life103-backend:latest
    restart: unless-stopped
    depends_on:
      life103-db:
        condition: service_healthy
    environment:
      LIFE103_DB_HOST: life103-db
      LIFE103_DB_PORT: "5432"
      LIFE103_DB_NAME: life103
      LIFE103_DB_USER: life103
      LIFE103_DB_PASSWORD: ${LIFE103_DB_PASSWORD}
      LOG_LEVEL: ${LIFE103_LOG_LEVEL:-INFO}  # flip to DEBUG + `up -d`, no rebuild
    networks:
      - life103
    # This is your app to debug, so keep more history than the media services would need.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped
    user: "${PUID}:${PGID}"  # plain Go binary; honours PUID/PGID unlike the postgis image
    environment:
      NTFY_BASE_URL: https://ntfy.home.kurup.net
      NTFY_BEHIND_PROXY: "true"
      # Port 8080, not ntfy's default 80: this container runs as PUID, and a non-root
      # process cannot bind a port below 1024. Traefik points at 8080 to match.
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/ntfy:/var/lib/ntfy
    networks:
      - life103

  # life103 APK distribution (8.2). Obtainium on each family phone watches this directory
  # listing and installs anything newer than what it has. Deliberately dumb: a directory of
  # signed APKs and nginx's autoindex, because Obtainium's self-hosted source is an HTML
  # scrape and there is nothing here worth a package index.
  #
  # APKs are built and signed on Vinod's laptop and scp'd here by android/bin/publish.sh --
  # the signing key never reaches this machine or CI (D7).
  life103-apk:
    container_name: life103-apk
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      # Read-only: this container serves files, it never writes them.
      - ${CONFIG_ROOT}/apk:/usr/share/nginx/html:ro
      - ./config/life103-apk/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - life103

volumes:
  scrutiny-influxdb:

networks:
  # Internal to the three life103 containers. Traefik joins it (see below) to route by
  # container name; nothing here is published to a host port.
  life103:
    driver: bridge
